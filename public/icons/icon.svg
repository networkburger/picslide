<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#ff5f8f"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ec8ff"/>
      <stop offset="1" stop-color="#bff0ff"/>
    </linearGradient>
    <g id="pic">
      <rect x="96" y="96" width="320" height="320" fill="url(#sky)"/>
      <circle cx="330" cy="170" r="62" fill="#fff6b0"/>
      <circle cx="330" cy="170" r="46" fill="#ffd93b"/>
      <ellipse cx="170" cy="400" rx="190" ry="140" fill="#5fd068"/>
      <ellipse cx="380" cy="430" rx="170" ry="130" fill="#3fb34f"/>
      <circle cx="150" cy="190" r="10" fill="#fff"/>
      <circle cx="168" cy="180" r="13" fill="#fff"/>
      <circle cx="188" cy="190" r="10" fill="#fff"/>
    </g>
    <clipPath id="c0"><rect x="96" y="96" width="156" height="156" rx="22"/></clipPath>
    <clipPath id="c1"><rect x="260" y="96" width="156" height="156" rx="22"/></clipPath>
    <clipPath id="c2"><rect x="96" y="260" width="156" height="156" rx="22"/></clipPath>
    <clipPath id="c3"><rect x="260" y="260" width="156" height="156" rx="22"/></clipPath>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#7a1f3d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="84" y="84" width="344" height="344" rx="34" fill="#ffffff" opacity="0.35"/>
  <use href="#pic" clip-path="url(#c0)"/>
  <use href="#pic" clip-path="url(#c2)"/>
  <use href="#pic" clip-path="url(#c3)"/>
  <g transform="translate(24 -30) rotate(10 338 174)" filter="url(#sh)">
    <use href="#pic" clip-path="url(#c1)"/>
  </g>
</svg>
