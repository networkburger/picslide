    <rect x="30" y="740" width="30" height="130" rx="8"/><rect x="130" y="740" width="30" height="130" rx="8"/><rect x="230" y="740" width="30" height="130" rx="8"/><rect x="330" y="740" width="30" height="130" rx="8"/><rect x="430" y="740" width="30" height="130" rx="8"/>
