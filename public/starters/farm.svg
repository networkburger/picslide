    <rect x="20" y="110" width="260" height="230" fill="#e2412f"/>
    <polygon points="20,110 150,10 280,110" fill="#e2412f"/>
    <rect x="105" y="200" width="90" height="140" fill="#fff"/>
    <rect x="115" y="210" width="70" height="130" fill="#8c2a1d"/>
