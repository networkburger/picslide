<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1536" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb8ff"/><stop offset="1" stop-color="#c9f1ff"/></linearGradient>
    <g id="flower"><circle r="14" cx="0" cy="-16" fill="#fff"/><circle r="14" cx="16" cy="0" fill="#fff"/><circle r="14" cx="0" cy="16" fill="#fff"/><circle r="14" cx="-16" cy="0" fill="#fff"/><circle r="11" fill="#ffc928"/></g>
    <g id="cloud"><ellipse cx="0" cy="0" rx="70" ry="40" fill="#fff"/><ellipse cx="55" cy="-25" rx="55" ry="45" fill="#fff"/><ellipse cx="115" cy="5" rx="60" ry="35" fill="#fff"/></g>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="830" cy="190" r="140" fill="#fff4a8"/>
  <circle cx="830" cy="190" r="100" fill="#ffd12e"/>
  <g stroke="#ffd12e" stroke-width="18" stroke-linecap="round">
