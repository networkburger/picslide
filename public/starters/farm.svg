    <line x1="185" y1="210" x2="115" y2="340" stroke="#fff" stroke-width="10"/>
    <circle cx="150" cy="105" r="30" fill="#fff"/><circle cx="150" cy="105" r="20" fill="#ffd12e"/>
  </g>
  <!-- tree -->
  <rect x="215" y="470" width="44" height="200" rx="12" fill="#8a5a33"/>
  <circle cx="237" cy="420" r="120" fill="#2f9e44"/>
  <circle cx="170" cy="470" r="80" fill="#37b24d"/>
  <circle cx="310" cy="470" r="80" fill="#37b24d"/>
  <circle cx="200" cy="400" r="18" fill="#ff4d4d"/><circle cx="280" cy="380" r="18" fill="#ff4d4d"/><circle cx="250" cy="480" r="18" fill="#ff4d4d"/><circle cx="160" cy="470" r="18" fill="#ff4d4d"/><circle cx="320" cy="455" r="18" fill="#ff4d4d"/>
