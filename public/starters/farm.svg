  </g>
  <use href="#flower" x="80" y="930"/><use href="#flower" x="200" y="970"/><use href="#flower" x="340" y="920"/><use href="#flower" x="470" y="975"/><use href="#flower" x="600" y="900"/><use href="#flower" x="960" y="960"/>
