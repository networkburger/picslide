  <!-- duck pond -->
  <ellipse cx="800" cy="930" rx="170" ry="55" fill="#5ec8ff"/>
  <g transform="translate(770 880)">
    <ellipse cx="0" cy="20" rx="45" ry="28" fill="#ffd12e"/><circle cx="30" cy="-10" r="22" fill="#ffd12e"/>
